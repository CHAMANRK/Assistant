<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assistant</title>
<style>
:root{--bg:#0f1a22;--panel:#162531;--ai:#1d3243;--me:#2b7a70;--ink:#e9f1f5;--mute:#8aa0ae;--acc:#f0c24b;--err:#ff8a7a}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--panel);border-bottom:1px solid #243746}
header h1{font-size:17px;font-weight:600;letter-spacing:.2px}
button{font:inherit;color:inherit;border:0;cursor:pointer}
#gear{background:none;font-size:20px;padding:4px 8px;color:var(--mute)}
#log{flex:1;overflow-y:auto;padding:14px 0 8px;display:flex;flex-direction:column;gap:10px}
#chips{display:flex;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid #243746;overflow-x:auto}
#chips button{background:#243746;border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
#chips button.on{background:var(--acc);color:#1a1405}
.crow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.cb{background:#2d4455;border-radius:10px;padding:8px 14px;font-size:14px}
.cb.go{background:var(--acc);color:#1a1405;font-weight:600}
.crow input{flex:1;min-width:140px;background:var(--bg);color:var(--ink);border:1px solid #2d4455;border-radius:8px;padding:8px;font:inherit}
.msg{white-space:pre-wrap;word-break:break-word;padding:11px 16px}
.msg.ai{width:100%;background:var(--ai);border-left:3px solid var(--acc)}
.msg.me{width:80%;align-self:flex-end;margin-right:12px;background:var(--me);border-radius:16px 16px 4px 16px}
.msg.err{border-left-color:var(--err);color:var(--err)}
.msg.wait{color:var(--mute)}
form{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--panel);border-top:1px solid #243746}
#in{flex:1;resize:none;max-height:120px;background:var(--bg);color:var(--ink);border:1px solid #2d4455;border-radius:12px;padding:10px 12px;font:inherit}
#in:focus,#send:focus-visible,#gear:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#send{background:var(--acc);color:#1a1405;font-weight:600;border-radius:12px;padding:0 18px}
dialog{width:min(92vw,460px);max-height:88vh;margin:auto;background:var(--panel);color:var(--ink);border:1px solid #2d4455;border-radius:14px;padding:16px;overflow:auto}
dialog::backdrop{background:#000a}
dialog h2{font-size:16px;margin-bottom:10px}
.prov{margin-bottom:14px}
.prov label{display:block;font-size:13px;color:var(--mute);margin:6px 0 3px}
.prov textarea,.prov input{width:100%;background:var(--bg);color:var(--ink);border:1px solid #2d4455;border-radius:8px;padding:8px;font:13px ui-monospace,monospace}
.prov textarea{height:64px}
.row{display:flex;gap:8px;justify-content:flex-end}
.row button{padding:9px 16px;border-radius:10px;background:#243746}
.row .ok{background:var(--acc);color:#1a1405;font-weight:600}
</style>
</head>
<body>
<header><h1>Assistant</h1><button id="gear" aria-label="Settings">⚙</button></header>
<nav id="chips"><button data-c="wifi">WiFi</button><button data-c="internet">Internet</button><button data-c="bluetooth">Bluetooth</button><button data-c="torch">Torch</button></nav>
<main id="log"></main>
<form id="f"><textarea id="in" rows="1" placeholder="Message likho"></textarea><button id="send" type="submit">Bhejo</button></form>
<dialog id="dlg">
  <h2>Keys aur model</h2>
  <div id="provs"></div>
  <div class="row"><button id="cancel" type="button">Band</button><button id="save" class="ok" type="button">Save</button></div>
</dialog>
<script>
const PROVIDERS=[
 {id:'groq',name:'Groq',url:'https://api.groq.com/openai/v1/chat/completions',model:'llama-3.3-70b-versatile'},
 {id:'openrouter',name:'OpenRouter',url:'https://openrouter.ai/api/v1/chat/completions',model:'meta-llama/llama-3.3-70b-instruct:free'},
 {id:'nvidia',name:'NVIDIA',url:'https://integrate.api.nvidia.com/v1/chat/completions',model:'meta/llama-3.3-70b-instruct'},
 {id:'cerebras',name:'Cerebras',url:'https://api.cerebras.ai/v1/chat/completions',model:'llama-3.3-70b'}
];
const SYSTEM=`Tu ek phone assistant hai. Tujhe Najeef ne banaya hai.
Jawab sabse chhota rakho, koi reason ya explanation nahi.
Tu ye kaam kar sakta hai: app kholna, torch on/off, volume (up/down/mute/0-100), brightness (0-100), WiFi/Internet/Bluetooth ka panel kholna, SMS bhejna, SMS padhna, phone call karna.
Agar user inme se koi kaam bole, to sirf ek line me command do, aur kuch nahi:
OPEN: <app ka naam>
DO: torch on | DO: torch off | DO: volume up | DO: volume down | DO: volume mute | DO: volume 40 | DO: brightness 70 | DO: wifi | DO: internet | DO: bluetooth
SMS: <contact ka naam ya number> | <message text>
READ: <contact ka naam> ya READ: last
CALL: <contact ka naam ya number>
Agar user puche tu kya kya kar sakta hai, to upar ki abilities chhote me bata do. Baaki sawalon ka seedha chhota jawab do. User ki bhasha me bolo.`;
const $=id=>document.getElementById(id);
const log=$('log'),inp=$('in'),dlg=$('dlg');
let history=[],busy=false;

const load=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return {}}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

function add(text,cls){
  const d=document.createElement('div');
  d.className='msg '+cls;d.textContent=text;
  log.appendChild(d);log.scrollTop=log.scrollHeight;return d;
}

function keysOf(p){return (load('cfg')[p.id]?.keys||'').split(',').map(s=>s.trim()).filter(Boolean)}
function modelOf(p){return load('cfg')[p.id]?.model||p.model}

async function post(p,key,messages){
  const req=fetch(p.url,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({model:modelOf(p),messages,max_tokens:200,temperature:0.2})
  });
  const timeout=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),25000));
  const r=await Promise.race([req,timeout]);
  if(!r.ok)throw new Error(p.name+' '+r.status);
  const j=await r.json();
  const t=j.choices?.[0]?.message?.content;
  if(!t)throw new Error(p.name+' empty');
  return t.trim();
}

async function askAI(messages){
  const idx=load('idx');
  for(const p of PROVIDERS){
    const keys=keysOf(p);
    if(!keys.length)continue;
    const start=(idx[p.id]||0)%keys.length;
    for(let i=0;i<keys.length;i++){
      const n=(start+i)%keys.length;
      try{
        const out=await post(p,keys[n],messages);
        idx[p.id]=n;store('idx',idx);
        return out;
      }catch(e){/* agli key / agla provider */}
    }
  }
  throw new Error('Sab keys fail. Settings me keys check karo.');
}

const plug=n=>{const p=window.Capacitor?.Plugins?.[n];if(!p)throw new Error('Ye sirf APK me chalta hai');return p};
const isNum=t=>/^\+?[\d\s\-]{7,}$/.test(t);

function btn(label,fn,cls){const b=document.createElement('button');b.type='button';b.textContent=label;b.className='cb '+(cls||'');b.onclick=fn;return b}
function card(text,build){
  return new Promise(res=>{
    const d=add(text,'ai');
    const row=document.createElement('div');row.className='crow';d.appendChild(row);
    build(row,v=>{row.remove();res(v)});
  });
}

async function doPhone(arg){
  const [a,...r]=arg.toLowerCase().split(/\s+/),v=r.join(' ');
  const P=plug('Phone');
  if(a==='torch'){await P.torch({on:v!=='off'});return 'ho gaya'}
  if(a==='volume'){await P.volume(/^\d+$/.test(v)?{action:'set',level:+v}:{action:v});return 'ho gaya'}
  if(a==='brightness'){await P.brightness({level:parseInt(v,10)});return 'ho gaya'}
  if(['wifi','internet','bluetooth'].includes(a)){await P.panel({type:a});return 'panel khol diya, toggle kar lo'}
  throw new Error('Ye command samajh nahi aayi');
}

async function resolveTarget(target){
  if(isNum(target)){const n=target.replace(/[\s\-]/g,'');return {name:n,number:n}}
  const m=(await plug('Sms').findContact({name:target})).matches||[];
  if(m.length===1)return {name:m[0].name,number:m[0].number};
  if(m.length>1){
    return card('Kaunsa '+target+'?',(row,done)=>{
      m.forEach(x=>row.appendChild(btn(x.name+' '+x.number,()=>done({name:x.name,number:x.number}))));
      row.appendChild(btn('Cancel',()=>done(null)));
    });
  }
  const n=await card(target+' contacts me nahi mila. Number likho:',(row,done)=>{
    const inp=document.createElement('input');inp.type='tel';inp.placeholder='Number';
    row.appendChild(inp);
    row.appendChild(btn('OK',()=>{const v=inp.value.trim();done(isNum(v)?v.replace(/[\s\-]/g,''):'')},'go'));
    row.appendChild(btn('Cancel',()=>done(null)));
    inp.focus();
  });
  if(!n)return null;
  return {name:n,number:n};
}

async function doCall(arg){
  const target=arg.trim();
  if(!target)throw new Error('Kisko call karna hai?');
  const who=await resolveTarget(target);
  if(!who)return 'Cancel kiya';
  const ok=await card('Call karo: '+who.name+' ('+who.number+')',(row,done)=>{
    row.appendChild(btn('Call',()=>done(true),'go'));
    row.appendChild(btn('Cancel',()=>done(false)));
  });
  if(!ok)return 'Cancel kiya';
  await plug('Phone').call({number:who.number});
  return 'ho gaya';
}

async function doSms(arg){
  const i=arg.indexOf('|');
  if(i<0)throw new Error('SMS ka format galat');
  const target=arg.slice(0,i).trim(),text=arg.slice(i+1).trim();
  if(!target||!text)throw new Error('Naam ya message khali hai');
  const S=plug('Sms');
  const who=await resolveTarget(target);
  if(!who)return 'Cancel kiya';
  const name=who.name,number=who.number;
  const ok=await card(name+' ('+number+')\n"'+text+'"',(row,done)=>{
    row.appendChild(btn('Bhejo',()=>done(true),'go'));
    row.appendChild(btn('Cancel',()=>done(false)));
  });
  if(!ok)return 'Cancel kiya';
  await S.send({number,text});
  return 'ho gaya';
}

async function doRead(arg){
  const t=arg.trim(),S=plug('Sms');
  let numbers=[];
  if(t&&!/^(last|latest|all|inbox)$/i.test(t)){
    if(isNum(t))numbers=[t];
    else{
      numbers=((await S.findContact({name:t})).matches||[]).map(x=>x.number);
      if(!numbers.length)throw new Error('Contact nahi mila: '+t);
    }
  }
  const msgs=(await S.read({numbers,limit:5})).messages||[];
  if(!msgs.length)return 'Koi msg nahi mila';
  return msgs.map(m=>(m.type===2?'Tumne '+(m.name||m.address)+' ko: ':(m.name||m.address)+': ')+m.body).join('\n\n');
}

async function runCmd(kind,arg){
  if(kind==='OPEN'){
    const P=plug('AppOpener');
    try{await P.open({name:arg})}catch(e){throw new Error('App nahi mili: '+arg)}
    return 'ho gaya';
  }
  if(kind==='DO')return doPhone(arg);
  if(kind==='SMS')return doSms(arg);
  if(kind==='READ')return doRead(arg);
  if(kind==='CALL')return doCall(arg);
  throw new Error('Command samajh nahi aayi');
}

async function send(text){
  busy=true;add(text,'me');
  const w=add('...','ai wait');
  history.push({role:'user',content:text});
  history=history.slice(-12);
  try{
    const reply=await askAI([{role:'system',content:SYSTEM},...history]);
    const m=reply.match(/^\s*(OPEN|DO|SMS|READ|CALL):\s*(.+)$/im);
    if(m){
      try{
        w.textContent=await runCmd(m[1].toUpperCase(),m[2].trim());
        w.className='msg ai';
      }catch(e){
        w.textContent=e.message||String(e);w.className='msg ai err';
      }
      history.push({role:'assistant',content:'ho gaya'});
    }else{
      w.textContent=reply;w.className='msg ai';
      history.push({role:'assistant',content:reply});
    }
  }catch(e){
    history.pop();
    w.textContent=e.message;w.className='msg ai err';
  }
  busy=false;log.scrollTop=log.scrollHeight;
}

$('f').addEventListener('submit',e=>{
  e.preventDefault();
  const t=inp.value.trim();
  if(!t||busy)return;
  inp.value='';inp.style.height='auto';send(t);
});
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=Math.min(inp.scrollHeight,120)+'px'});

function syncNative(){try{plug('Overlay').saveConfig({cfg:JSON.stringify(load('cfg')),system:SYSTEM})}catch(e){}}
let asked=false;
async function setupOverlay(){
  const prompt=!asked;asked=true;
  try{await plug('Overlay').setup({prompt})}catch(e){}
}
syncNative();setupOverlay();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)setupOverlay()});

let torchOn=false;
document.querySelectorAll('#chips button').forEach(b=>b.onclick=async()=>{
  const c=b.dataset.c;
  try{
    if(c==='torch'){torchOn=!torchOn;await plug('Phone').torch({on:torchOn});b.classList.toggle('on',torchOn)}
    else await plug('Phone').panel({type:c});
  }catch(e){if(c==='torch')torchOn=!torchOn;add(e.message||String(e),'ai err')}
});

function buildSettings(){
  const cfg=load('cfg');
  $('provs').innerHTML='';
  PROVIDERS.forEach(p=>{
    const d=document.createElement('div');d.className='prov';
    d.innerHTML=`<label>${p.name} keys (comma se alag)</label><textarea data-k="${p.id}" spellcheck="false"></textarea><label>${p.name} model</label><input data-m="${p.id}" spellcheck="false">`;
    d.querySelector('textarea').value=cfg[p.id]?.keys||'';
    d.querySelector('input').value=cfg[p.id]?.model||p.model;
    $('provs').appendChild(d);
  });
}
function openSettings(){buildSettings();dlg.showModal()}
$('gear').onclick=openSettings;
$('cancel').onclick=()=>dlg.close();
$('save').onclick=()=>{
  const cfg={};
  PROVIDERS.forEach(p=>{
    cfg[p.id]={
      keys:document.querySelector(`[data-k="${p.id}"]`).value.trim(),
      model:document.querySelector(`[data-m="${p.id}"]`).value.trim()||p.model
    };
  });
  store('cfg',cfg);store('idx',{});syncNative();dlg.close();
};

if(!PROVIDERS.some(p=>keysOf(p).length)){
  add('Pehle settings (⚙) me apni keys paste karo.','ai');
}
</script>
</body>
</html>
