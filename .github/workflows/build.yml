name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx cap add android
      - name: Add native plugin and permission
        run: |
          mkdir -p android/app/src/main/java/com/chaman/assistant
          cp native/*.java android/app/src/main/java/com/chaman/assistant/
          python3 - <<'PYEOF'
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p).read()
          s = s.replace('<application', open('native/permissions.xml').read() + '<application', 1)
          s = s.replace('</application>', open('native/components.xml').read() + '</application>', 1)
          open(p, 'w').write(s)
          PYEOF
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: assistant-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
